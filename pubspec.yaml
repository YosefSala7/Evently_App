name: evently
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  gap: ^3.0.1
  flutter_svg: ^2.3.2
  flutter_bounceable: ^1.2.0
  flutter_gen: ^5.15.0
  shared_preferences: 

  flutter_localizations:
    sdk: flutter

dev_dependencies:
  build_runner: ^2.12.0
  flutter_gen_runner:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter_gen:
  output: lib/core/gen/
  integrations:
    image: true
    flutter_svg: true

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf